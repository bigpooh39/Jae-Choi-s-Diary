<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta name="theme-color" content="#4763d6" />
  <title>나의 2026–2027 다이어리</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="#" aria-label="다이어리 홈"><span class="brand-mark">✦</span><span>CHOI's<br /><b>diary</b></span></a>
      <nav class="main-nav" aria-label="주요 메뉴">
        <button class="nav-link active" data-view="dashboard"><span>⌂</span>오늘</button>
        <button class="nav-link" data-view="month"><span>▦</span>월간 캘린더</button>
        <button class="nav-link" data-view="week"><span>▤</span>주간 플래너</button>
        <button class="nav-link" data-view="day"><span>☀</span>일간 다이어리</button>
        <button class="nav-link" data-view="goals"><span>◎</span>목표 · 통계</button>
        <button class="nav-link" data-view="settings"><span>⚙</span>설정</button>
      </nav>
      <div class="sidebar-footer"><small>2026. 09 — 2027. 12</small><p>나만의 리듬으로<br />오늘을 기록해요.</p></div>
    </aside>

    <main>
      <header class="topbar">
        <button id="menuBtn" class="icon-btn menu-btn" aria-label="메뉴 열기">☰</button>
        <div class="date-nav"><button id="prevBtn" class="icon-btn" aria-label="이전">‹</button><h1 id="pageTitle">2026년 9월</h1><button id="nextBtn" class="icon-btn" aria-label="다음">›</button><button id="todayBtn" class="today-btn">오늘로</button></div>
        <div class="top-actions"><label class="search"><span>⌕</span><input id="searchInput" placeholder="기록 검색" aria-label="기록 검색" /></label><button id="themeBtn" class="icon-btn" aria-label="테마 변경">☾</button><button id="quickAdd" class="primary-btn">＋ 빠른 기록</button></div>
      </header>
      <section id="searchResults" class="search-results hidden" aria-live="polite"></section>
      <div id="view" class="view"></div>
    </main>
  </div>

  <dialog id="entryDialog">
    <form id="entryForm" method="dialog">
      <div class="dialog-head"><div><p class="eyebrow">새 기록</p><h2 id="dialogTitle">오늘을 채워볼까요?</h2></div><button type="button" class="icon-btn" id="closeDialog" aria-label="닫기">×</button></div>
      <div class="type-tabs"><button type="button" class="type-tab selected" data-type="event">일정</button><button type="button" class="type-tab" data-type="todo">할 일</button><button type="button" class="type-tab" data-type="note">메모 · 일기</button></div>
      <input id="entryType" type="hidden" value="event" />
      <label>제목<input id="entryTitle" required maxlength="80" placeholder="무엇을 기록할까요?" /></label>
      <div class="form-row"><label>날짜<input id="entryDate" type="date" required /></label><label class="event-only">시간<input id="entryTime" type="time" /></label></div>
      <div class="form-row todo-only hidden"><label>우선순위<select id="entryPriority"><option value="보통">보통</option><option value="높음">높음</option><option value="낮음">낮음</option></select></label><label>마감일<input id="entryDue" type="date" /></label></div>
      <label class="note-only hidden">내용<textarea id="entryBody" rows="4" placeholder="오늘의 생각과 기억을 남겨보세요."></textarea></label>
      <div class="form-row note-only hidden"><label>기분<select id="entryMood"><option>😊 기분 좋아요</option><option>😌 평온해요</option><option>😐 보통이에요</option><option>😮‍💨 지쳤어요</option></select></label><label>날씨<select id="entryWeather"><option>☀ 맑음</option><option>☁ 흐림</option><option>☂ 비</option><option>❄ 눈</option></select></label></div>
      <menu><button type="button" id="deleteEntry" class="danger-btn hidden">삭제</button><span></span><button type="button" id="cancelEntry" class="secondary-btn">취소</button><button id="saveEntry" type="submit" class="primary-btn">저장하기</button></menu>
    </form>
  </dialog>
  <input id="importInput" type="file" accept="application/json" hidden />
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="app.js"></script>
</body>
</html>
